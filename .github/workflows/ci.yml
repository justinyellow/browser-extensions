name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test shared/*.test.js
      - name: Build bug-capture
        working-directory: bug-capture
        run: npm ci && npm run build
      - name: Build tab-organizer
        working-directory: tab-organizer
        run: npm ci && npm run build
      - name: Build vault-context
        working-directory: vault-context
        run: npm ci && npm run build
