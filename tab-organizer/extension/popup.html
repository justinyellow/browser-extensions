<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <h1>Tab Organizer</h1>
  <label class="row"><input type="checkbox" id="autoOrganize"> Auto-organize</label>
  <label>Grouping
    <select id="groupingGranularity">
      <option value="coarse">Coarse (company / project)</option>
      <option value="balanced">Balanced (workstreams)</option>
      <option value="fine">Fine (repo / surface)</option>
    </select>
  </label>
  <button id="organize">Organize new tabs</button>
  <button id="saveTab" class="secondary">Save this tab to Obsidian</button>
  <button id="digest" class="secondary">Write today's digest</button>
  <button id="regroup" class="secondary">Regroup everything</button>
  <button id="cleanup" class="secondary">Clean up stale tabs now</button>
  <button id="ungroup" class="secondary">Ungroup all</button>
  <p id="status" class="muted"></p>
  <details id="cleanedBox">
    <summary>Recently cleaned (<span id="cleanedCount">0</span>)</summary>
    <ul id="cleaned"></ul>
  </details>
  <a href="#" id="options">Settings</a>
  <script src="popup.js" type="module"></script>
</body>
</html>
